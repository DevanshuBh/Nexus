global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingest
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["ingest:8080"] }]
  - job_name: query
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["query:8081"] }]
  - job_name: writer
    static_configs: [{ targets: ["writer:9404"] }]
  - job_name: gateway
    static_configs: [{ targets: ["gateway:9405"] }]
